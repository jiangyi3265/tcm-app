name: Deploy Production Frontend

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_PUBLIC_APP_BASE_URL: https://yuanyuanyiyuan.oksja.cn
      VITE_APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test and build
        run: |
          node --test tests/*.test.js
          npm run build
      - name: Publish to production
        shell: bash
        env:
          PRODUCTION_DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$PRODUCTION_DEPLOY_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$PRODUCTION_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/production_key
          cp .github/production_known_hosts ~/.ssh/production_hosts
          tar -C dist -czf /tmp/yuanyuan-frontend.tar.gz .
          SHA256=$(sha256sum /tmp/yuanyuan-frontend.tar.gz | cut -d ' ' -f 1)
          ssh -i ~/.ssh/production_key -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/production_hosts \
            root@152.136.191.51 "deploy $GITHUB_SHA $SHA256" < /tmp/yuanyuan-frontend.tar.gz
      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/production_key
